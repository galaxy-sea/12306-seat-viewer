<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12306 动车座位图</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
      padding: 16px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      max-width: 100%;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    #trainKeyboard {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      max-width: 100vw;
      background: #fff;
    }

    #trainKeyboard p {
      margin: 0;
      text-align: right;
    }

    #trainKeyboard>div {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      width: 100%;
    }

    #trainKeyboard button {
      width: 100%;
      min-height: 46px;
    }

    #keyboardConfirm {
      width: auto;
      min-width: 72px;
    }

    #trainOptionList {
      width: min(100%, 420px);
      max-height: min(50vh, 320px);
      margin-top: 4px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    #trainOptionList button {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 6px 8px;
      white-space: normal;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .site-footer {
      text-align: center;
    }

    .site-footer hr {
      height: 1px;
      margin: 16px 0 4px;
    }

    .site-footer a,
    .site-footer a:hover,
    .site-footer a:active,
    .site-footer a:focus {
      color: inherit;
      text-decoration: none;
      cursor: default;
    }
  </style>
</head>

<body>
  <main>
    <h1>12306 动车座位图</h1>

    <p>
      <label>出行日期 <input id="dateInput" type="date"></label>
    </p>

    <div>
      <label>
        车次号
        <input id="trainNumberInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
          inputmode="latin" readonly placeholder="例如 G1、D3123" aria-controls="trainOptionList" aria-expanded="false">
      </label>
      <div id="trainOptionList" role="listbox" hidden></div>
    </div>

    <div id="trainKeyboard" hidden>
      <p><button id="keyboardConfirm" type="button">确认</button></p>
      <div>
        <button type="button" data-key="G">G</button>
        <button type="button" data-key="D">D</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="C">C</button>
        <button type="button" data-key="K">K</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="L">L</button>
        <button type="button" data-key="T">T</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="Z">Z</button>
        <button type="button" data-key="Y">Y</button>
        <button type="button" data-key="S">S</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-action="backspace">⌫</button>
      </div>
    </div>

    <p id="statusText">输入车次号后开始查询</p>

    <section id="resultPanel" hidden>
      <h2 id="selectedTrain"></h2>
      <p id="selectedRoute"></p>
      <p id="galleryStatus"></p>

      <div id="seatGallery"></div>
    </section>

    <li><a href="https://github.com/galaxy-sea/12306-seat-viewer">12306 车次座位查看：插件支持</a>
      <ul>
        <li><a href="https://chromewebstore.google.com/detail/jgmpdcecbnbmcfmkiiphgebgbmfjnjbh">Chrome Web Store</a></li>
        <li><a href="https://microsoftedge.microsoft.com/addons/detail/kmkdnljedmgognmnjkfmcbkhbbfhkmpc">Microsoft Edge Add-ons</a></li>
        <li><a href="https://addons.mozilla.org/zh-CN/firefox/addon/12306-seat-viewer/">Add-ons for Firefox</a></li>
        <li><a href="https://greasyfork.org/zh-CN/scripts/584065-12306-%E8%BD%A6%E6%AC%A1%E5%BA%A7%E4%BD%8D%E6%9F%A5%E7%9C%8B">Tampermonkey</a></li>
      </ul>
    </li>
  </main>

  <footer class="site-footer">
    <hr style="margin-bottom: 16px;">
    <p style="margin-bottom: 0px;">二手局的座位从来不会让你失望</p>
    <small>© 2015–present <a href="../">ChangJin Wei (魏昌进)</a></small>
  </footer>

  <script>
    const searchEndpoint = "https://kyfw12306-api-proxy.wcj.plus/search/v1/train/search";
    const metaEndpoint = "https://kyfw12306-api-proxy.wcj.plus/otn/queryTrainInfo/query";
    const detailEndpoint = "https://kyfw12306-api-proxy.wcj.plus/wxxcx/openplatform-inner/miniprogram/wifiapps/appFrontEnd/v2/lounge/open-smooth-common/trainStyleBatch/getCarDetail";
    const imagePrefix = "https://wifi.12306.cn/resourcecenter/cateringimages/";

    const dateInput = document.getElementById("dateInput");
    const trainNumberInput = document.getElementById("trainNumberInput");
    const trainOptionList = document.getElementById("trainOptionList");
    const trainKeyboard = document.getElementById("trainKeyboard");
    const keyboardConfirm = document.getElementById("keyboardConfirm");
    const statusText = document.getElementById("statusText");
    const resultPanel = document.getElementById("resultPanel");
    const selectedTrain = document.getElementById("selectedTrain");
    const selectedRoute = document.getElementById("selectedRoute");
    const galleryStatus = document.getElementById("galleryStatus");
    const seatGallery = document.getElementById("seatGallery");

    let searchTimer = null;
    let searchAbort = null;
    let searchInFlightKey = "";
    let searchInFlightPromise = null;
    let selectedItem = null;
    let searchResults = [];
    const useCustomKeyboard = window.matchMedia("(pointer: coarse)").matches;

    const formatLocalDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    };

    const toApiDate = (value) => value.replace(/-/g, "");

    const escapeHtml = (value) =>
      String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const getKeyword = () => {
      return trainNumberInput.value.trim();
    };

    const normalizeTrainNumber = (value) => {
      return value.replace(/[^a-z0-9]/gi, "").toUpperCase();
    };

    const setStatus = (text) => {
      statusText.textContent = text;
    };

    const openDatePicker = () => {
      if (typeof dateInput.showPicker === "function") {
        dateInput.showPicker();
      }
    };

    const clearSuggestions = () => {
      trainOptionList.innerHTML = "";
      trainOptionList.hidden = true;
      trainNumberInput.setAttribute("aria-expanded", "false");
      searchResults = [];
    };

    const dedupeByTrainCode = (items) => {
      const seen = new Set();
      return items.filter((item) => {
        const code = item.station_train_code;
        if (!code || seen.has(code)) return false;
        seen.add(code);
        return true;
      });
    };

    const searchTrains = async () => {
      const keyword = getKeyword();
      const date = dateInput.value;
      const searchKey = `${date}|${keyword.toUpperCase()}`;

      if (searchInFlightPromise && searchInFlightKey === searchKey) {
        return searchInFlightPromise;
      }

      selectedItem = null;
      resultPanel.hidden = true;
      clearSuggestions();

      if (!keyword) {
        setStatus("输入车次号后开始查询");
        return [];
      }

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      setStatus("正在查询车次...");
      const url = `${searchEndpoint}?keyword=${encodeURIComponent(keyword)}&date=${encodeURIComponent(toApiDate(date))}`;

      searchInFlightKey = searchKey;
      searchInFlightPromise = (async () => {
        try {
          const response = await fetch(url, { signal: searchAbort.signal });
          if (!response.ok) throw new Error("Search failed");
          const data = await response.json();
          const results = dedupeByTrainCode(Array.isArray(data?.data) ? data.data : []);
          renderSuggestions(results);
          setStatus(results.length ? "" : "没有匹配车次");
          return results;
        } catch (error) {
          if (error.name === "AbortError") return [];
          setStatus("查询失败，请稍后重试");
          return [];
        } finally {
          if (searchInFlightKey === searchKey) {
            searchInFlightKey = "";
            searchInFlightPromise = null;
          }
        }
      })();

      return searchInFlightPromise;
    };

    const scheduleSearch = () => {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(searchTrains, 300);
    };

    const showTrainKeyboard = () => {
      if (!useCustomKeyboard) return;
      trainNumberInput.readOnly = true;
      trainKeyboard.hidden = false;
    };

    const updateTrainInput = (value) => {
      trainNumberInput.value = normalizeTrainNumber(value);
      clearSuggestions();
      scheduleSearch();
    };

    const appendTrainKey = (key) => {
      updateTrainInput(`${trainNumberInput.value}${key}`);
    };

    const backspaceTrainKey = () => {
      updateTrainInput(trainNumberInput.value.slice(0, -1));
    };

    const renderSuggestions = (items) => {
      searchResults = items;
      if (items.length === 1) {
        const item = items[0];
        trainNumberInput.value = item.station_train_code;
        trainOptionList.innerHTML = "";
        trainOptionList.hidden = true;
        trainNumberInput.setAttribute("aria-expanded", "false");
        selectTrain(item);
        return;
      }
      trainOptionList.innerHTML = items
        .map((item, index) => {
          const route = `${item.from_station || ""} -> ${item.to_station || ""}`;
          const label = `${item.station_train_code} ${route}`;
          return `<button type="button" role="option" data-index="${index}">${escapeHtml(label)}</button>`;
        })
        .join("");
      trainOptionList.hidden = !items.length;
      trainNumberInput.setAttribute("aria-expanded", String(items.length > 0));
    };

    const fetchTrainMeta = async (trainNo, date) => {
      const url = `${metaEndpoint}?leftTicketDTO.train_no=${encodeURIComponent(trainNo)}&leftTicketDTO.train_date=${encodeURIComponent(date)}&rand_code=`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Meta failed");
      const data = await response.json();
      const rows = Array.isArray(data?.data?.data) ? data.data.data : [];
      return Array.from(new Set(rows.map((row) => row.station_train_code).filter(Boolean)));
    };

    const fetchSeatPics = async (trainCode, date) => {
      const url = `${detailEndpoint}?carCode=&trainCode=${encodeURIComponent(trainCode)}&runningDay=${encodeURIComponent(toApiDate(date))}&reqType=form`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Seat detail failed");
      const data = await response.json();
      return Array.isArray(data?.content?.data?.coachDetailPicList)
        ? data.content.data.coachDetailPicList
        : [];
    };

    const selectTrain = async (item) => {
      selectedItem = item;
      resultPanel.hidden = false;
      selectedTrain.textContent = item.station_train_code;
      selectedRoute.textContent = `${item.from_station || ""} -> ${item.to_station || ""}`;
      seatGallery.innerHTML = "";
      galleryStatus.textContent = "正在加载车辆信息和座位图...";

      try {
        const codes = await fetchTrainMeta(item.train_no, dateInput.value);
        const detailTrainCode = codes.find((code) => code === item.station_train_code) || codes[0] || item.station_train_code;
        const pics = await fetchSeatPics(detailTrainCode, dateInput.value);
        renderSeatPics(pics);
        galleryStatus.textContent = pics.length ? `共 ${pics.length} 张座位图` : "未找到座位图";
      } catch {
        galleryStatus.textContent = "加载失败，请稍后重试";
      }
    };

    const renderSeatPics = (pics) => {
      const sorted = pics.slice().sort((a, b) => (a?.picOrder || 0) - (b?.picOrder || 0));
      seatGallery.innerHTML = sorted
        .map((pic) => {
          const url = pic?.pictureUrl?.startsWith("http")
            ? pic.pictureUrl
            : `${imagePrefix}${pic?.pictureUrl || ""}`;
          const name = (pic?.pictureName || "座位图").split("#")[0] || "座位图";
          return `
            <figure>
              <img src="${escapeHtml(url)}" alt="${escapeHtml(name)}" loading="lazy">
              <figcaption>${escapeHtml(name)}</figcaption>
            </figure>
          `;
        })
        .join("");
    };

    const today = formatLocalDate(new Date());
    dateInput.min = today;
    dateInput.value = today;
    clearSuggestions();
    if (!useCustomKeyboard) {
      trainNumberInput.removeAttribute("readonly");
    }
    dateInput.addEventListener("click", openDatePicker);
    trainNumberInput.addEventListener("click", showTrainKeyboard);
    trainNumberInput.addEventListener("focus", showTrainKeyboard);
    trainNumberInput.addEventListener("input", () => {
      if (useCustomKeyboard) return;
      const normalizedValue = normalizeTrainNumber(trainNumberInput.value);
      if (trainNumberInput.value !== normalizedValue) {
        trainNumberInput.value = normalizedValue;
      }
      scheduleSearch();
    });
    trainOptionList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-index]");
      if (!button) return;
      const item = searchResults[Number(button.dataset.index)];
      if (!item) return;
      trainNumberInput.value = item.station_train_code;
      trainOptionList.hidden = true;
      trainNumberInput.setAttribute("aria-expanded", "false");
      selectTrain(item);
    });
    trainKeyboard.addEventListener("click", (event) => {
      if (!useCustomKeyboard) return;
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.key) {
        appendTrainKey(button.dataset.key);
        return;
      }
      if (button.dataset.action === "backspace") {
        backspaceTrainKey();
      }
    });
    keyboardConfirm.addEventListener("click", async () => {
      trainKeyboard.hidden = true;
      if (searchTimer) {
        clearTimeout(searchTimer);
        searchTimer = null;
        await searchTrains();
      }
    });
    dateInput.addEventListener("change", () => {
      if (dateInput.value < today) {
        dateInput.value = today;
      }
      if (selectedItem) {
        selectTrain(selectedItem);
        return;
      }
      scheduleSearch();
    });
  </script>
</body>

</html>
